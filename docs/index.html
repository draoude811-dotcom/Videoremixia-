<script>
    // ================= CONFIG BACKEND =================
    const BACKEND_URL = 'http://localhost:5000';

    // ================= DOM =================
    const uploadZone = document.getElementById('uploadZone');
    const videoInput = document.getElementById('videoInput');
    const selectedFile = document.getElementById('selectedFile');
    const fileName = document.getElementById('fileName');
    const removeFile = document.getElementById('removeFile');
    const uploadBtn = document.getElementById('uploadBtn');
    const loader = document.getElementById('loader');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const resultSection = document.getElementById('resultSection');
    const resultVideo = document.getElementById('resultVideo');
    const downloadBtn = document.getElementById('downloadBtn');

    let selectedVideoFile = null;

    uploadZone.addEventListener('click', () => videoInput.click());

    uploadZone.addEventListener('dragover', e => {
        e.preventDefault();
        uploadZone.classList.add('border-purple-500', 'bg-purple-500/10');
    });

    uploadZone.addEventListener('dragleave', e => {
        e.preventDefault();
        uploadZone.classList.remove('border-purple-500', 'bg-purple-500/10');
    });

    uploadZone.addEventListener('drop', e => {
        e.preventDefault();
        uploadZone.classList.remove('border-purple-500', 'bg-purple-500/10');
        if (e.dataTransfer.files.length > 0) {
            handleFileSelection(e.dataTransfer.files[0]);
        }
    });

    videoInput.addEventListener('change', e => {
        if (e.target.files.length > 0) {
            handleFileSelection(e.target.files[0]);
        }
    });

    function handleFileSelection(file) {
        selectedVideoFile = file;
        fileName.textContent = file.name;
        selectedFile.classList.remove('hidden');
        uploadBtn.disabled = false;
        hideError();
        hideResult();
    }

    removeFile.addEventListener('click', e => {
        e.stopPropagation();
        resetFileSelection();
    });

    function resetFileSelection() {
        selectedVideoFile = null;
        videoInput.value = '';
        selectedFile.classList.add('hidden');
        uploadBtn.disabled = true;
    }

    function showLoader() {
        loader.classList.remove('hidden');
        uploadBtn.disabled = true;
    }

    function hideLoader() {
        loader.classList.add('hidden');
        uploadBtn.disabled = false;
    }

    function showError(msg) {
        errorText.textContent = msg;
        errorMessage.classList.remove('hidden');
    }

    function hideError() {
        errorMessage.classList.add('hidden');
    }

    function showResult(videoUrl) {
        resultVideo.src = videoUrl;
        downloadBtn.href = videoUrl;
        resultSection.classList.remove('hidden');
        downloadBtn.classList.remove('pointer-events-none', 'opacity-50');
    }

    function hideResult() {
        resultSection.classList.add('hidden');
        resultVideo.src = '';
    }

    uploadBtn.addEventListener('click', async () => {
        if (!selectedVideoFile) return;

        showLoader();
        hideError();
        hideResult();

        try {
            const formData = new FormData();
            // ✅ NOM CORRECT POUR FLASK
            formData.append('file', selectedVideoFile);

            const response = await fetch(`${BACKEND_URL}/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok || !data.video_url) {
                throw new Error(data.error || 'Erreur serveur');
            }

            const videoUrl = `${BACKEND_URL}${data.video_url}`;
            showResult(videoUrl);
            resetFileSelection();

        } catch (err) {
            showError(err.message);
        } finally {
            hideLoader();
        }
    });
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Videoremixia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎬 Videoremixia</h1>

<p>Génère jusqu’à 30 vidéos par mois</p>

<div class="pricing">
  <div>
    <h2>Basic</h2>
    <p>10€ / mois<br>90€ / an</p>
  </div>
  <div>
    <h2>Pro</h2>
    <p>15€ / mois<br>135€ / an</p>
  </div>
</div>

<input id="promo" placeholder="Code promo">
<button onclick="applyPromo()">Appliquer</button>
<p id="promoResult"></p>

<hr>

<input type="file" id="videoInput">
<button onclick="upload()">Générer la vidéo</button>

<video id="result" controls></video>

<script src="script.js"></script>
</body>
</html>
